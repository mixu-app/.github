# Starter workflow: Publish Apache-2.0 KMP open-source libraries to Maven Central Portal.
# Triggered on semantic version tags (v*.*.*) or manual workflow_dispatch.
# Requires organization/repository Action Secrets:
#   - MAVEN_CENTRAL_USERNAME
#   - MAVEN_CENTRAL_PASSWORD
#   - GPG_SIGNING_KEY
#   - GPG_SIGNING_PASSWORD
name: Publish to Maven Central

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run verification and local Maven publication without uploading to Central Portal"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, Sign & Publish KMP Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify submodule pins
        run: ./script/check-pins.sh

      - name: Set up JDK 25 LTS
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run quality gates before publishing
        run: ./gradlew --no-daemon check

      - name: Publish to local Maven repository (Dry Run / Verification)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: ./gradlew --no-daemon publishToMavenLocal

      - name: Sign and publish to Maven Central Portal
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon publishAllPublicationsToMavenCentralRepository
